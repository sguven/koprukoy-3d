<style>
:root {
  /* One visual world: Central Anatolian steppe, Kızılırmak canyon. Full-screen scene with a paper-map control layer on top. */
  --ink: #2b2620;
  --muted: #6f655a;
  --paper: rgba(248, 244, 236, 0.93);
  --line: #d8cfc1;
  --accent: #a2482f;
  --water: #2f7680;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  /* notch / home-bar insets (viewport-fit=cover) */
  --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
/* Home-screen web app on iOS: the page is laid out one status bar short, which left a grey band under the scene.
   Growing the root by the top inset makes it cover the whole screen (fit() below also sizes the scene from the screen). */
html { overflow: hidden; }
@media (display-mode: standalone) { html { min-height: calc(100% + env(safe-area-inset-top, 0px)); } }
body { background: #cdd8de; color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
body.is-touch { touch-action: none; position: fixed; inset: 0; }
#scene { position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h, 100%); }
canvas { display: block; touch-action: none; }
#labels { position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h, 100%); pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); will-change: transform; white-space: nowrap; font: 600 12px/1 var(--body); padding: 5px 8px; border-radius: 4px; background: rgba(43, 38, 32, 0.82); color: #fff; }
.lbl.tarihi { background: var(--accent); }
.lbl.su { background: var(--water); }
.lbl.yol { background: #5a5f66; }
.lbl.yon { background: rgba(255, 255, 255, 0.9); color: var(--ink); }

.topbar { position: fixed; z-index: 40; top: calc(12px + var(--st)); left: calc(12px + var(--sl)); right: calc(12px + var(--sr)); display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
.siteBtn { pointer-events: auto; font-weight: 700; }
.brand { pointer-events: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.brand h1 { font: 700 24px/1 var(--display); margin: 0; letter-spacing: 0.01em; }
.brand .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.modes { pointer-events: auto; display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 4px; gap: 4px; }
.modes button { font: 600 15px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; border: 0; background: transparent; color: var(--ink); padding: 9px 12px; border-radius: 7px; cursor: pointer; }
.modes button.on { background: var(--ink); color: #fff; }
.modes button:disabled { opacity: 0.35; cursor: not-allowed; }
.modes button:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spacer { flex: 1; }
.gear { pointer-events: auto; font: 600 14px var(--body); border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--ink); }

.panel { position: fixed; z-index: 45; top: 74px; left: 12px; width: 300px; max-height: calc(100% - 90px); overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 24px rgba(40, 30, 20, 0.12); }
.panel.hidden { display: none; }
.panel [hidden] { display: none !important; }
.adv summary { font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); cursor: pointer; list-style: none; }
.adv summary::-webkit-details-marker { display: none; }
.adv summary::after { content: ' ▸'; } .adv[open] summary::after { content: ' ▾'; }
.group-title { font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .pbtn { font: 600 13px/1 var(--body); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pbtn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip input { accent-color: var(--accent); margin: 0; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }
.note { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin: 0; }
.note strong { color: var(--ink); }

.hud { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; align-items: flex-end; gap: 14px; pointer-events: none; }
.hud.show { display: flex; }
.hud.show.cockpit { display: none; }   /* the Toros's own speedometer is in view */
.speedo { background: rgba(30, 27, 23, 0.82); color: #fff; border-radius: 12px; padding: 8px 16px 10px; text-align: center; min-width: 120px; }
.speedo b { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; display: block; }
.speedo span { font: 600 12px var(--body); opacity: 0.8; letter-spacing: 0.06em; }
.hint { position: fixed; right: 16px; bottom: 16px; font-size: 12px; background: var(--paper); border: 1px solid var(--line); padding: 7px 11px; border-radius: 8px; max-width: 320px; }
.toast { position: fixed; z-index: 35; top: 40%; left: 50%; transform: translate(-50%, -50%); max-width: 86vw; text-align: center; background: rgba(30, 27, 23, 0.86); color: #fff; font: 700 22px var(--display); padding: 12px 20px; border-radius: 10px; display: none; letter-spacing: 0.03em; }
#minimap { position: fixed; right: 16px; top: 74px; width: 170px; height: 170px; border-radius: 50%; border: 3px solid var(--paper); box-shadow: 0 4px 16px rgba(0,0,0,0.2); display: none; }
#minimap.show { display: block; }
/* v1.12: the map is moved and turned by the compositor (a CSS transform every frame) instead of being redrawn into a canvas 30 times a second */
#minimap .mmClip { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; clip-path: circle(50%); background: #d6c8aa; }
#mmMap { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#mmTop { position: absolute; inset: 0; width: 100%; height: 100%; }
#mmN { position: absolute; left: 0; top: 0; font-weight: bold; font-family: sans-serif; color: #2b2620; line-height: 1; will-change: transform; }
/* v1.0: frame-time meter (Settings › Show FPS) */
#perf { position: fixed; z-index: 30; left: 12px; bottom: 12px; font: 600 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(30, 27, 23, 0.72); color: #fff; padding: 4px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
body:not(.is-touch)[data-mode="game"] #perf { bottom: auto; top: 64px; }
body.is-touch #perf { left: 50%; transform: translateX(-50%); bottom: calc(4px + var(--sb, 0px)); font-size: 10px; padding: 2px 6px; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; }
/* nişangah: CS tarzı yeşil artı, koyu kenarlı — gökyüzünde de açık zeminde de görünür; --gap ateş dağılımıyla açılır */
.crosshair { position: fixed; z-index: 20; left: 50%; top: 50%; width: 0; height: 0; display: none; pointer-events: none; --gap: 4px; --len: 9px; --th: 2px; }
.crosshair.off { visibility: hidden; }
.crosshair i { position: absolute; background: #4dff5c; box-shadow: 0 0 0 1px rgba(0,0,0,0.85); border-radius: 1px; }
.crosshair .ct { left: calc(var(--th) / -2); top: calc(-1 * (var(--gap) + var(--len))); width: var(--th); height: var(--len); }
.crosshair .cb { left: calc(var(--th) / -2); top: var(--gap); width: var(--th); height: var(--len); }
.crosshair .cl { top: calc(var(--th) / -2); left: calc(-1 * (var(--gap) + var(--len))); width: var(--len); height: var(--th); }
.crosshair .cr { top: calc(var(--th) / -2); left: var(--gap); width: var(--len); height: var(--th); }
.crosshair .cd { left: -1px; top: -1px; width: 2px; height: 2px; }
body.is-touch .crosshair { --len: 11px; --th: 3px; }
body.is-touch .crosshair .cd { left: -1.5px; top: -1.5px; width: 3px; height: 3px; }

/* dokunmatik kontroller */
.touch { position: fixed; inset: auto 0 0 0; height: 0; pointer-events: none; }
.tc { position: fixed; z-index: 30; display: none; pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; }
.tc.show { display: flex; }
/* sol yarı: parmağın değdiği yerde beliren joystick */
.joyzone { left: 0; top: calc(64px + var(--st)); bottom: 0; width: 45%; }
.joyzone.show { display: block; }
.joy { position: absolute; left: calc(28px + var(--sl)); bottom: calc(28px + var(--sb)); width: 128px; height: 128px; margin: 0; border-radius: 50%; background: rgba(30,27,23,0.28); border: 2px solid rgba(255,255,255,0.55); display: flex; align-items: center; justify-content: center; opacity: 0.55; transition: opacity 0.15s; pointer-events: none; }
.joy.active { opacity: 1; transition: none; }
.joy.run { border-color: #ffd27a; }
.joy i { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: block; }
.joyzone .jlabel { position: absolute; left: calc(28px + var(--sl)); bottom: calc(162px + var(--sb)); width: 128px; text-align: center; font: 600 12px var(--display); letter-spacing: 0.06em; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); opacity: 0.8; pointer-events: none; }
.pad { border-radius: 14px; background: rgba(30,27,23,0.55); color: #fff; font: 700 17px var(--display); letter-spacing: 0.05em; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.35); }
.pad.down { background: rgba(162,72,47,0.85); }
#tLeft { left: 18px; bottom: 26px; width: 74px; height: 74px; }
#tRight { left: 104px; bottom: 26px; width: 74px; height: 74px; }
#tGas { right: calc(18px + var(--sr)); bottom: calc(26px + var(--sb)); width: 96px; height: 132px; border-radius: 18px; }
#tBrake { right: calc(126px + var(--sr)); bottom: calc(26px + var(--sb)); width: 88px; height: 88px; border-radius: 18px; }
#tGas.down { background: rgba(70,140,70,0.88); }
/* v1.20: in the Toros the left thumb steers on a wide pill (analog: a light push turns a little) */
body[data-mode="car"] .joy { width: 184px; height: 92px; border-radius: 46px; }
body[data-mode="car"] .joyzone .jlabel { width: 184px; bottom: calc(126px + var(--sb)); }
#tUp { right: 18px; bottom: 112px; width: 64px; height: 64px; }
/* oyun butonları: sağ alt köşede başparmak kümesi */
.gbtn { border-radius: 50%; font-size: 13px; letter-spacing: 0.06em; }
#tFire { right: calc(22px + var(--sr)); bottom: calc(26px + var(--sb)); width: 108px; height: 108px; border-radius: 50%; background: rgba(162,72,47,0.72); border-color: rgba(255,255,255,0.6); font-size: 19px; }
#tFire.down { background: rgba(200,60,35,0.95); }
#tFire.wait { background: rgba(90,80,72,0.6); border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); }
#tReload { right: calc(142px + var(--sr)); bottom: calc(30px + var(--sb)); width: 62px; height: 62px; }
#tJump { right: calc(44px + var(--sr)); bottom: calc(148px + var(--sb)); width: 62px; height: 62px; }
#tScope { right: calc(142px + var(--sr)); bottom: calc(106px + var(--sb)); width: 62px; height: 62px; }
#tScope.on { background: rgba(162,72,47,0.85); }
#gameHud .gh-ammo { flex-direction: column; align-items: flex-end; gap: 0; } #gameHud .gh-ammo small { font: 700 13px var(--display); letter-spacing: 0.1em; opacity: 0.85; } #gameHud .gh-ammo div { display: flex; align-items: baseline; gap: 8px; }
#gameHud .gh-slots { position: absolute; right: 24px; bottom: 96px; display: flex; gap: 6px; font: 600 12px var(--display); } #gameHud .gh-slots span { background: rgba(30,27,23,0.5); padding: 3px 8px; border-radius: 6px; opacity: 0.6; } #gameHud .gh-slots span.on { opacity: 1; background: rgba(162,72,47,0.8); }
#gameHud .gh-scope { position: absolute; inset: 0; display: none; background: radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0) 38vmin, rgba(0,0,0,0.97) 39vmin); }
#gameHud .gh-scope i { position: absolute; left: 50%; top: 50%; width: 76vmin; height: 76vmin; transform: translate(-50%, -50%); background: linear-gradient(#000, #000) center / 100% 1px no-repeat, linear-gradient(#000, #000) center / 1px 100% no-repeat; }
#gameHud { position: fixed; inset: 0; pointer-events: none; display: none; font-family: var(--display); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
#gameHud .gh-top { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); display: flex; gap: 22px; font: 800 24px var(--display); background: rgba(30,27,23,0.55); padding: 6px 18px; border-radius: 10px; letter-spacing: 0.04em; }
#gameHud .gh-feed { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); font: 600 14px var(--display); text-align: center; }
#gameHud .gh-health { position: absolute; left: 20px; bottom: 22px; display: flex; align-items: center; gap: 10px; font: 800 26px var(--display); }
#gameHud .gh-bar { width: 220px; height: 14px; background: rgba(0,0,0,0.45); border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,0.4); }
#gameHud .gh-bar i { display: block; height: 100%; width: 100%; background: #7cc26b; transition: width 0.15s; }
#gameHud .gh-ammo { position: absolute; right: 24px; bottom: 22px; font: 800 34px var(--display); display: flex; align-items: baseline; gap: 8px; }
#gameHud .gh-ammo span { font-size: 18px; opacity: 0.85; } #gameHud .gh-ammo em { font: 600 13px var(--display); color: #ffd27a; margin-left: 8px; }
#gameHud .gh-hurt { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(200,30,20,0) 45%, rgba(200,30,20,0.9) 100%); opacity: 0; }
#gameHud .gh-dead, #gameHud .gh-end { position: absolute; inset: 0; display: none; place-items: center; background: rgba(30,10,8,0.45); }
#gameHud .gh-dead > div, #gameHud .gh-end > div { text-align: center; display: grid; gap: 8px; } #gameHud .gh-dead b, #gameHud .gh-end b { font: 900 46px var(--display); letter-spacing: 0.08em; } #gameHud .gh-dead span, #gameHud .gh-end span { font: 600 18px var(--display); } #gameHud small { opacity: 0.8; }
@media (max-width: 720px) { #gameHud .gh-dead b, #gameHud .gh-end b { font-size: 30px; letter-spacing: 0.04em; padding: 0 12px; } }
@media (max-width: 720px) and (pointer: fine) { #gameHud .gh-top { top: 60px; font-size: 18px; } #gameHud .gh-health { bottom: 150px; } #gameHud .gh-ammo { bottom: 150px; right: 16px; font-size: 28px; } }
/* v1.24 Birlikte oyna: button, name box, list of players, names over the other players */
#gameHud #ghMp { position: absolute; left: 20px; top: 86px; pointer-events: auto; font: 700 15px var(--display); color: #fff; background: rgba(47,127,224,0.85); border: 1px solid rgba(255,255,255,0.5); border-radius: 10px; padding: 9px 14px; cursor: pointer; text-shadow: none; }
#gameHud #ghMp.on { background: rgba(30,27,23,0.6); }
#gameHud #ghPlayers { position: absolute; left: 20px; top: 132px; display: none; min-width: 170px; max-width: 46vw; background: rgba(30,27,23,0.55); border-radius: 10px; padding: 6px 10px; font: 600 13px var(--display); }
#gameHud #ghPlayers div { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#gameHud #ghPlayers div.me { color: #9fd0ff; } #gameHud #ghPlayers div.wait, #gameHud #ghPlayers div.mode { opacity: 0.75; font-size: 12px; }
#gameHud #ghMpDlg { position: absolute; inset: 0; display: none; place-items: center; background: rgba(20,16,12,0.55); pointer-events: auto; text-shadow: none; z-index: 5; }
#gameHud #ghMpDlg form { width: min(380px, calc(100vw - 32px)); background: var(--paper, #f4ecdc); color: #2a241d; border-radius: 14px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); max-height: calc(100vh - 24px); overflow: auto; }
#gameHud #ghMpDlg b { font: 800 20px var(--display); } #gameHud #ghMpDlg p { margin: 0; font: 500 15px/1.4 var(--body, sans-serif); }
#gameHud #ghMpDlg label { display: grid; gap: 6px; font: 700 14px var(--display); }
#gameHud #ghMpDlg input { font: 600 18px var(--body, sans-serif); padding: 10px 12px; border: 1px solid #b9ab92; border-radius: 9px; background: #fff; color: #2a241d; }
#gameHud #ghMpDlg .modes2 { display: grid; gap: 8px; }
#gameHud #ghMpDlg .modes2 button { text-align: left; display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 2px solid #cfc2a8; background: #fff; color: #2a241d; cursor: pointer; }
#gameHud #ghMpDlg .modes2 button b { font: 800 15px var(--display); } #gameHud #ghMpDlg .modes2 button span { font: 500 13px var(--body, sans-serif); opacity: 0.8; }
#gameHud #ghMpDlg .modes2 button.on { border-color: #2f7fe0; background: #eaf3ff; }
#gameHud #ghMpDlg .row { display: flex; gap: 10px; justify-content: flex-end; }
#gameHud #ghMpDlg .row button { font: 700 16px var(--display); padding: 11px 18px; border-radius: 10px; border: 1px solid #b9ab92; background: #fff; color: #2a241d; cursor: pointer; }
#gameHud #ghMpDlg #ghMpGo { background: #2f7fe0; border-color: #2f7fe0; color: #fff; }
#gameHud #ghMpDlg small { font: 600 13px var(--body, sans-serif); color: #a2482f; opacity: 1; }
body:has(#ghMpDlg[style*="grid"]) #cross { visibility: hidden; }
#mpLabels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#mpLabels span { position: absolute; left: 0; top: 0; display: none; font: 700 13px var(--display); color: #fff; background: rgba(47,127,224,0.85); padding: 2px 8px; border-radius: 8px; white-space: nowrap; will-change: transform; }
#mpLabels span.dead { background: rgba(80,80,80,0.75); }
body:not([data-mode="game"]) #mpLabels { display: none; }
body.is-touch #gameHud #ghMp { left: calc(14px + var(--sl)); top: calc(96px + var(--st)); font-size: 13px; padding: 8px 11px; }
body.is-touch #gameHud #ghPlayers { left: calc(14px + var(--sl)); top: calc(136px + var(--st)); font-size: 12px; min-width: 140px; }
@media (orientation: portrait) { body.is-touch #gameHud #ghMp { top: calc(136px + var(--st)); } body.is-touch #gameHud #ghPlayers { top: calc(176px + var(--st)); } }
/* oyun HUD'u dokunmatik ekranda: köşelere küçük, butonların altında kalmayacak şekilde */
body.is-touch .modes button:disabled { display: none; }
body.is-touch .hint { display: none; }
body.is-touch[data-mode="game"] .brand { display: none; }
body.is-touch[data-mode="game"] .modes { flex: 0 0 auto; }
body.is-touch[data-mode="game"] .modes button { flex: 0 0 auto; padding: 9px 14px; }
body.is-touch[data-mode="game"] #minimap { width: 104px; height: 104px; top: calc(62px + var(--st)); right: calc(12px + var(--sr)); }
body.is-touch #gameHud .gh-top { top: calc(64px + var(--st)); font-size: 18px; padding: 4px 12px; gap: 14px; }
body.is-touch #gameHud .gh-feed { top: calc(100px + var(--st)); font-size: 12px; }
body.is-touch #gameHud .gh-health { left: calc(14px + var(--sl)); top: calc(66px + var(--st)); bottom: auto; font-size: 18px; gap: 8px; }
body.is-touch #gameHud .gh-bar { width: 104px; height: 10px; }
body.is-touch #gameHud .gh-ammo { right: calc(222px + var(--sr)); bottom: calc(74px + var(--sb)); font-size: 26px; }

  } else if (mode === 'walk' || mode === 'fly') { const n = Math.ceil(dt / 0.05); for (let i = 0; i < n; i++) walkStep(dt / n, mode === 'fly'); focus = camera.position; drawMinimap(P.x, P.z, -P.yaw); }
  else if (mode === 'game') {
    if (bench) bench.pre(dt);
    const n = Math.ceil(dt / 0.05); for (let i = 0; i < n; i++) walkStep(dt / n, false);
    game.update(dt, now); focus = camera.position;
    drawMinimap(P.x, P.z, -P.yaw);
    if (mmDue) { drawMinimapTop(); game.drawMinimap(mctx, botToMinimap); }
  }
  else if (mode === 'car') {
    // physics sub-steps
    const n = Math.ceil(dt / 0.008); for (let i = 0; i < n; i++) carStep(dt / n);
    const c = Math.cos(CS.h + carYawOff), s = Math.sin(CS.h + carYawOff);
    if (CS.cam === 0) { camPos.set(CS.x - c * 7.2, CS.y + 2.6 + carPitchOff * 6, CS.z + s * 7.2); const minY = terrH(camPos.x, camPos.z) + 1; camPos.y = Math.max(camPos.y, minY); if (camera.position.distanceTo(camPos) > 40) camera.position.copy(camPos); else camera.position.lerp(camPos, 1 - Math.exp(-dt * 6)); camTarget.set(CS.x + Math.cos(CS.h) * 3, CS.y + 1.1, CS.z - Math.sin(CS.h) * 3); camera.lookAt(camTarget); }
    else if (CS.cam === 1) driverCam(dt);
    else { const local = new THREE.Vector3(0.75, 1.5, 0); car.updateMatrixWorld(); camera.position.copy(local.applyMatrix4(car.matrixWorld)); const fwd = new THREE.Vector3(Math.cos(carYawOff) * 10, -0.6 - carPitchOff * 6, -Math.sin(carYawOff) * 10).applyMatrix4(car.matrixWorld); camera.lookAt(fwd); }
    cabin.update(Math.abs(CS.v) * 3.6, CS.rpm, CS.steer, !radio.paused);
    { const cockpit = CS.cam === 1; if (hudEl.classList.contains('cockpit') !== cockpit) hudEl.classList.toggle('cockpit', cockpit); }
    focus = car.position; drawMinimap(CS.x, CS.z, Math.PI / 2 - CS.h); updateHud();
    carYawOff *= Math.exp(-dt * (lookId === null ? 2 : 0)); carPitchOff *= Math.exp(-dt * (lookId === null ? 2 : 0));
  }
  // small village details and far grass patches: shown / hidden by distance (re-checked every 4 m of camera movement)
  // shadow camera follows the focus. v1.0: the shadow map is static and redrawn only when the focus has moved a few
  // metres (6 m on foot, 4 % of the view size in orbit), the view size changed, the Toros drives (it casts a shadow),
  // or something else asked for it (time of day, layers, culling). Light, camera and map always change together.
  // v1.1, Game mode: the map covers 150 m around the player and is redrawn every 24 m (about every 3 s at a run, it
  // was every 6 m = 0.75 s), and its camera moves in whole texels, so the shadow edges do not crawl when it is redrawn.
  const inGame = mode === 'game', driving = mode === 'car';
  // v1.12, Toros: the map covers 150 m around a point up to 35 m ahead of the car and is redrawn every 24 m (it was
  // redrawn every frame: the car is now added on top of a cached map, src/carshadow.js), snapped to whole texels
  if (driving) { const ahead = Math.max(-15, Math.min(35, CS.v * 1.5)); focus = carAhead.set(CS.x + Math.cos(CS.h) * ahead, CS.y, CS.z - Math.sin(CS.h) * ahead); }
  // v1.18: the third-person walk too (the character is drawn on the cached map like the car)
  const walkingTP = tpActive(), mover = inGame || driving || walkingTP;
  // v1.20: a phone driving the Toros: the map covers 190 m and is redrawn every 40 m (every 24 m it was a full redraw
  // ~1.7 times a second at 150 km/h, each one a visible hitch on a phone)
  const phoneCar = driving && isTouch;
  const ext = mode === 'orbit' ? Math.min(900, Math.max(150, camera.position.distanceTo(focus) * 1.2)) : phoneCar ? 190 : mover ? 150 : 140;
  const step = mode === 'orbit' ? ext * 0.04 : phoneCar ? 40 : mover ? 24 : 6;
  // small village details and far grass patches: shown / hidden by distance (re-checked every 4 m of camera movement);
  // the shadow map only needs a refresh when something inside it appeared or went
  const cullChanged = culler.update(camera.position, false, inGame && !GAME_PRESETS[gamePreset].shadowOnCull ? 0 : ext); if (cullChanged) sun.shadow.needsUpdate = true;
  if (sun.shadow.needsUpdate || shadowFocus.distanceToSquared(focus) > step * step || Math.abs(ext - shadowExt) > shadowExt * 0.08) {
    const sc = sun.shadow.camera; if (sc.right !== ext) { sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 1; sc.far = 4000; sc.updateProjectionMatrix(); }
    shadowCentre.copy(focus);
    if (mover) {   // snap the centre to the texel grid of the light (its right / up axes)
      const texel = 2 * ext / sun.shadow.mapSize.x, a = focus.dot(lightRight), b = focus.dot(lightUp);
      shadowCentre.addScaledVector(lightRight, Math.round(a / texel) * texel - a).addScaledVector(lightUp, Math.round(b / texel) * texel - b);
    }
    sun.target.position.copy(shadowCentre); sun.position.copy(shadowCentre).addScaledVector(sunDir, 1500);
    shadowFocus.copy(focus); shadowExt = ext; sun.shadow.needsUpdate = true;
  }
  const shadowRedrawn = carShadow.plan(driving, walkingTP); if (shadowRedrawn) perf.shadowRedrawn();
  const tRender = performance.now();
  renderer.info.reset(); renderer.render(scene, camera); if (inGame && game) game.renderOverlay(renderer); renderMirrors(); placeLabels();
  if (bench && bench.active) bench.post(frameMs, tFrame, tRender, shadowRedrawn, cullChanged);
});
</script>
